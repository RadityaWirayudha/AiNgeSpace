<!--
  PurpSpace favicon. Same petals as logo/wizard-fire-logo-v3.svg, stripped to
  what survives a 16px tab: no dashed crest, no sparks, no corner brackets, no
  Gaussian glow. The pinwheel is scaled up 1.18× about the centre because at
  favicon size the artwork's own generous padding is most of the pixels.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="ps-plate" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1a1829"/>
      <stop offset="65%" stop-color="#121118"/>
      <stop offset="100%" stop-color="#09090c"/>
    </radialGradient>
    <linearGradient id="ps-tl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6b21a8"/>
      <stop offset="60%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="ps-tr" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="60%" stop-color="#c026d3"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="ps-bl" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="60%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <linearGradient id="ps-br" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a21caf"/>
      <stop offset="60%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="ps-core" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f0abfc" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#ps-plate)"/>

  <g transform="translate(256 256) scale(1.18) translate(-256 -256)">
    <path d="M 235,115 C 175,120 128,160 132,222 C 134,242 148,246 164,238 C 186,226 204,202 218,178 C 228,160 236,138 235,115 Z" fill="url(#ps-tl)"/>
    <path d="M 224,136 C 186,146 156,176 158,212 C 168,206 185,190 198,170 C 208,154 218,142 224,136 Z" fill="url(#ps-core)" opacity="0.75"/>

    <path d="M 277,115 C 337,120 384,160 380,222 C 378,242 364,246 348,238 C 326,226 308,202 294,178 C 284,160 276,138 277,115 Z" fill="url(#ps-tr)"/>
    <path d="M 288,136 C 326,146 356,176 354,212 C 344,206 327,190 314,170 C 304,154 294,142 288,136 Z" fill="url(#ps-core)" opacity="0.75"/>

    <path d="M 132,274 C 134,336 175,382 235,387 C 236,364 228,342 218,324 C 204,300 186,276 164,264 C 148,256 134,260 132,274 Z" fill="url(#ps-bl)"/>
    <path d="M 158,290 C 156,326 186,356 224,366 C 218,360 208,348 198,332 C 185,312 168,296 158,290 Z" fill="url(#ps-core)" opacity="0.65"/>

    <path d="M 380,274 C 378,336 337,382 277,387 C 276,364 284,342 294,324 C 308,300 326,276 348,264 C 364,256 378,260 380,274 Z" fill="url(#ps-br)"/>
    <path d="M 354,290 C 356,326 326,356 288,366 C 294,360 304,348 314,332 C 327,312 344,296 354,290 Z" fill="url(#ps-core)" opacity="0.65"/>
  </g>
</svg>
